<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AboutRynru</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Динамічний фон -->
    <div class="dynamic-background" id="bg"></div>

    <!-- Підсвітка за мишкою -->
    <div class="mouse-glow"></div>

    <!-- Ліва панель -->
    <div class="glass-sidebar" id="sidebar"></div>

    <!-- Центральний великий блок -->
    <div class="glass-main-card" id="mainCard"></div>

    <!-- Правий вузький блок -->
    <div class="glass-right-card" id="rightCard"></div>

    <!-- Нижній блок вводу -->
    <div class="glass-input-bar" id="inputBar"></div>

    <!-- Підключаємо скрипт -->
    <script src="script.js"></script>
</body>
</html>
