<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AboutRynru</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Динамічний фон з відступами та заокругленнями -->
    <div class="dynamic-background" id="bg"></div>

    <!-- Підсвітка за мишкою -->
    <div class="mouse-glow"></div>
    <p></p>

    <script>
        document.onmousemove = function(e) {
            let glow = document.querySelector(".mouse-glow");
            let bg = document.getElementById("bg");

            // Рух підсвітки
            glow.style.left = e.clientX - 100 + "px";
            glow.style.top = e.clientY - 100 + "px";

            // Легкий паралакс для фону
            let width = window.innerWidth;
            let height = window.innerHeight;
            let xPos = (e.clientX / width - 0.5) * 20;
            let yPos = (e.clientY / height - 0.5) * 20;

            bg.style.transform = `translate(${-xPos}px, ${-yPos}px)`;
        }
    </script>
</body>
</html>
