<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="is-loading" aria-busy="true">

    <div class="app-loader" id="appLoader" role="status" aria-live="polite">
        <div class="app-loader-status" id="appLoaderStatus"></div>
        <div class="app-loader-bar" aria-hidden="true"><span></span></div>
    </div>

    <div class="dynamic-background" id="bg"></div>
    <div class="dynamic-background dynamic-background-next" id="bgNext"></div>

    <div class="mouse-glow" id="mouseGlow"></div>

    <div class="glass-sidebar" id="sidebar">
        <div class="sidebar-view active" id="normalView"></div>

        <div class="sidebar-view" id="settingsView">
            <h3>Interface Settings</h3>
            
            <div class="setting-group">
                <label for="op1">Cube 1 Opacity</label>
                <input type="range" id="op1" min="0.1" max="0.9" step="0.01" value="0.25">
            </div>

            <div class="setting-group">
                <label for="op2">Cube 2 Opacity</label>
                <input type="range" id="op2" min="0.1" max="0.9" step="0.01" value="0.25">
            </div>

            <div class="setting-group">
                <label for="op3">Cube 3 Opacity</label>
                <input type="range" id="op3" min="0.1" max="0.9" step="0.01" value="0.25">
            </div>

            <div class="setting-group">
                <label for="op4">Cube 4 Opacity</label>
                <input type="range" id="op4" min="0.1" max="0.9" step="0.01" value="0.25">
            </div>

            <label class="section-title" for="themeSelect">Theme</label>
            <div class="theme-dropdown" id="themeDropdown">
                <button class="theme-select" id="themeSelect" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <span id="themeSelectLabel">Blue Mountains</span>
                    <span class="theme-select-arrow">⌄</span>
                </button>
                <div class="theme-options" id="themeOptions" role="listbox">
                    <button type="button" role="option" data-theme="mountains" aria-selected="true">Blue Mountains</button>
                    <button type="button" role="option" data-theme="forest" aria-selected="false">Forest</button>
                    <button type="button" role="option" data-theme="beach" aria-selected="false">Beach</button>
                    <button type="button" role="option" data-theme="sakura" aria-selected="false">Sakura</button>
                </div>
            </div>
        </div>

        <button class="settings-dot" id="settingsDot" type="button" aria-label="Open settings" title="Settings"></button>
    </div>

    <div class="glass-main-card" id="mainCard"></div>
    <div class="glass-right-card" id="rightCard"></div>
    <div class="glass-input-bar" id="inputBar"></div>
    <script src="script.js"></script>
</body>
</html>
